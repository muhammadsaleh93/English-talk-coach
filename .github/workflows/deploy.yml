name: Deploy app to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server unit tests
        run: node --test tests/*.test.mjs
      - name: Install browser for app tests
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: App end-to-end test (Android phone)
        run: mkdir -p e2e-shots && SHOTS_DIR=e2e-shots node tests/e2e/run.mjs
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$GEMINI" ] && missing="$missing GEMINI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Not deployed yet. Add these GitHub secrets first:$missing (see SETUP.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test worker
        run: node --test tests/*.test.mjs

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "latest"
          command: deploy
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Smoke test the live app
        if: steps.check.outputs.ready == 'true'
        run: |
          URL="https://english-talk-coach.muhammadsalehpk90.workers.dev"
          sleep 10
          fail=0
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/"); echo "home page: $code"; [ "$code" = 200 ] || fail=1
          echo "health: $(curl -sS "$URL/api/health")"
          echo "security headers:"; curl -sI "$URL/" | grep -iE "content-security-policy|x-frame-options|permissions-policy" || fail=1
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/chat" -H "content-type: application/json" -H "origin: https://evil.example" -d '{}')
          echo "foreign origin blocked: $code"; [ "$code" = 403 ] || fail=1
          post() { curl -sS -m 60 -w " (%{http_code}, %{time_total}s)\n" -X POST "$URL/api/chat" -H "content-type: application/json" -H "origin: $URL" -d "$1"; }
          echo "== chat =="; out=$(post '{"level":"beginner","topic":"Introduce yourself","helperLang":"ur","history":[{"role":"coach","text":"Hi! What is your name?"},{"role":"me","text":"my name ali i from pakistan"}]}'); echo "$out"; echo "$out" | grep -q '"reply"' || fail=1
          echo "== translate =="; out=$(post '{"mode":"translate","helperLang":"ar","text":"What do you like to do on weekends?"}'); echo "$out"; echo "$out" | grep -q '"translation"' || fail=1
          echo "== summary =="; out=$(post '{"mode":"summary","level":"beginner","topic":"Introduce yourself","helperLang":"ur","history":[{"role":"coach","text":"How long have you lived in Saudi Arabia?"},{"role":"me","text":"i am living here since two years"}]}'); echo "$out"; echo "$out" | grep -q '"grammar"' || fail=1
          echo "== daily pack =="; out=$(post '{"mode":"daily","level":"beginner","helperLang":"ur"}'); echo "$out" | head -c 1500; echo; echo "$out" | grep -q '"quiz"' || fail=1
          exit $fail
